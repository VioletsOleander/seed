# Server options.
set-option -s extended-keys on
set-option -s extended-keys-format csi-u
set-option -s escape-time 50
set-option -s focus-events on
set-option -us terminal-features
set-option -as terminal-features ",xterm*:RGB"

# Global session options.
set-option -g prefix C-a
set-option -g mouse on
set-option -g base-index 1
set-option -g history-limit 50000
set-option -g renumber-windows on
set-option -g display-time 4000
# set-option -g visual-activity on
set-option -g prompt-cursor-style bar
set-option -g prompt-command-cursor-style block

# Dayfox
set-option -g message-style "fg=#3d2b5a,bg=#f6f2ee,fill=#f6f2ee"
set-option -g message-command-style "fg=#3d2b5a,bg=#e7d2be,fill=#e7d2be"
set-option -g status-left "#[fg=#2848a9][#S]#[default] "
set-option -g status-right "#{?client_prefix,#[reverse]<Prefix>#[noreverse]} #{?pane_in_mode,#[reverse]#{?#{==:#{pane_mode},copy-mode},<COPY>,#{?#{==:#{pane_mode},view-mode},<VIEW>,#{?#{==:#{pane_mode},tree-mode},<CHOOSE>}}}#[noreverse]} #{pane_title}"
set-option -g status-style "fg=#643f61,bg=#e4dcd4"

# Global window options.
set-option -g mode-keys vi
# set-option -g monitor-activity on

# Dayfox
set-option -g window-status-style "fg=#837a72"
set-option -g window-status-current-style "fg=#2848a9,bold"
set-option -g copy-mode-match-style "fg=#3d2b5a,bg=#a4c1c2"
set-option -g copy-mode-current-match-style "fg=#f6f2ee,bg=#396847"

# Keybinds
bind-key -N "Send the prefix key" C-a send-prefix

bind-key -N "Goto left pane" h select-pane -L
bind-key -N "Goto right pane" l select-pane -R
bind-key -N "Goto up pane" k select-pane -U
bind-key -N "Goto down pane" j select-pane -D

bind-key -N "Goto previous window" C-h select-window -p
bind-key -N "Goto next window" C-l select-window -n
bind-key -N "Goto last visited window" BSpace select-window -l

bind-key -N "Split window vertically" | split-window -h -c "#{pane_current_path}"
bind-key -N "Split window horizontally" - split-window -v -c "#{pane_current_path}"

bind-key -N "Toggle selection" -T copy-mode-vi v if-shell -F "#{selection_present}" "send-keys -X clear-selection" "send-keys -X begin-selection"
bind-key -N "Copy selection" -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -N "Toggle rectangle selection" -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -N "Goto line start" -T copy-mode-vi H send -X back-to-indentation
bind-key -N "Goto line end" -T copy-mode-vi L send -X end-of-line

bind-key -N "Right click to paste" -T root MouseDown3Pane paste-buffer

bind-key -N "Reload config" r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

